[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "autoviz"
version = "1.0.0"
description = "Real-time marketing data plotter that watches a CSV file and updates matplotlib charts"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.3",
    "matplotlib>=3.4",
]

[project.optional-dependencies]
data = ["kagglehub>=0.2"]

[project.scripts]
autoviz = "autoviz.cli:main"

[tool.setuptools]
packages = ["autoviz"]
