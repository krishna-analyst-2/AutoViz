name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
        include:
          # oldest version the PRD asks for (NFR-1)
          - os: ubuntu-22.04
            python-version: "3.8"
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # kagglehub needs 3.9+, and it's only used by scripts/prepare_data.py
      - run: pip install "pandas>=1.3" "matplotlib>=3.4"
      - run: python -m unittest discover tests -v
      - run: python autoviz.py --csv data/campaign_history.csv --snapshot out.png
